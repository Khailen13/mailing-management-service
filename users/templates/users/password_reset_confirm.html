{% extends 'mailing/base.html' %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
{% include 'mailing/menu.html' %}
  {% if validlink %}
    <h1>Смена пароля</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Подтвердить</button>
    </form>
  {% else %}
    <p>
      Вероятно ссылка неверна или уже была использована
    </p>
  {% endif %}
{% endblock %}
