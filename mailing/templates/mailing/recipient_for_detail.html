<div class="ms-3 me-auto text-black">
    <a class="link-underline mb-0 mb-0 fw-medium text-primary me-3 link-underline-opacity-0"
       href="{% url 'mailing:message_detail' object.pk %}">{{object.id}}. "{{ object.full_name }}"</a>
    <hr class="me-0 mt-2"/>
    <p style="white-space: pre-wrap; text-indent: 25px;"
         class="lh-base "> email: {{ object.email }}</p>
    <p style="white-space: pre-wrap; text-indent: 25px;"
         class="lh-base "> Комментарий: {{ object.comment }}</p>
</div>
